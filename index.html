<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aromas - OSHI HOME v7</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --oshi-gold: #D4AF37; --oshi-black: #1a1a1a; --md-sys-color-primary: #6750a4; --md-sys-color-surface: #fef7ff; --md-sys-color-on-surface: #1d1b20; --md-sys-color-surface-variant: #e7e0ec; --md-sys-color-outline: #79747e; --md-sys-color-error: #b3261e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); max-width: 480px; margin: 0 auto; min-height: 100vh; }
        /* PIN SEGURIDAD */
        #pin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        /* NOTIFICACIONES */
        #toast-container { position: fixed; top: 20px; width: 100%; z-index: 9999; pointer-events: none; text-align: center; }
        .toast { padding: 15px; margin: 10px; border-radius: 10px; color: white; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .toast-success { background: #4caf50; }
        .toast-error { background: #f44336; cursor: pointer; pointer-events: all; }
        
        header { padding: 24px; text-align: center; border-bottom: 1px solid var(--md-sys-color-surface-variant); }
        .tabs { display: flex; border-bottom: 1px solid var(--md-sys-color-surface-variant); }
        .tab { flex: 1; padding: 15px; text-align: center; font-size: 13px; font-weight: 600; color: var(--md-sys-color-outline); cursor: pointer; }
        .tab.active { color: var(--md-sys-color-primary); border-bottom: 2px solid var(--md-sys-color-primary); }
        main { padding: 20px; padding-bottom: 100px; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #e7e0ec; }
        input, select, textarea { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #d1d1d1; margin-bottom: 10px; }
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: bold; background: var(--md-sys-color-primary); color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="pin-overlay">
        <h2>OSHI HOME</h2>
        <input type="password" id="pin-input" placeholder="Ingrese PIN" style="width: 200px;">
        <button class="btn" style="width: 200px;" onclick="verificarPin()">Acceder</button>
    </div>

    <div id="toast-container"></div>

    <header>
        <img src="logo.png" alt="OSHI HOME Logo" style="max-width: 150px;">
    </header>
<main>
        <div id="view-ventas" class="view active">
            <div class="card">
                <label>Nombre del Cliente</label>
                <input type="text" id="cliente-nombre" placeholder="Nombre...">
                <label>Seleccionar Producto</label>
                <select id="select-producto"><option value="">Cargando...</option></select>
                <label>Cantidad</label>
                <input type="number" id="cantidad-producto" value="1" min="1">
                <button type="button" class="btn btn-primary" onclick="agregarAlPedido()">+ Agregar al pedido</button>
            </div>
            <div id="resumen-actual" style="display:none;">
                <h3 style="font-size:17px; margin-bottom:12px;">Detalle del Pedido</h3>
                <div class="card" id="lista-pedido"></div>
                <textarea id="notas-pedido" placeholder="Notas / Dedicatoria"></textarea>
                <div class="card" style="background: var(--md-sys-color-primary-container);">
                    <div style="display:flex; justify-content:space-between; font-weight:700; font-size:20px;">
                        <span>TOTAL:</span><span id="total-pedido">$0</span>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" onclick="finalizarVenta(true)">Finalizar y WhatsApp</button>
            </div>
        </div>

        <div id="view-productos" class="view">
            <div id="prod-menu-main">
                <div class="card">
                    <h3 id="form-producto-title">Añadir Producto</h3>
                    <input type="hidden" id="p-id">
                    <input type="text" id="p-nombre" placeholder="Nombre Producto">
                    <input type="number" id="p-precio" placeholder="Precio ($)">
                    <input type="number" id="p-stock" placeholder="Stock">
                    <div id="form-buttons-añadir">
                        <button class="btn btn-primary" onclick="guardarProducto()">Guardar Producto</button>
                    </div>
                    <div id="form-buttons-editar" style="display:none;">
                        <button class="btn" style="background:var(--md-sys-color-primary);" onclick="actualizarProducto()">Confirmar Edición</button>
                        <button class="btn" style="background:#79747e; margin-top:10px;" onclick="limpiarFormularioProducto()">Cancelar</button>
                    </div>
                </div>
                <input type="text" id="buscar-producto" placeholder="🔍 Buscar producto..." oninput="actualizarPantallas()">
                <div id="lista-inventario"></div>
            </div>
        </div>

        <div id="view-historial" class="view">
            <h3 style="margin-bottom:15px;">Ventas Realizadas</h3>
            <div id="lista-historial"></div>
        </div>

        <div id="view-estadisticas" class="view">
            <div class="card"><h3>Ingresos Totales</h3><h1 id="est-total-ingresos">$0</h1></div>
            <div class="card"><h3>Producto Estrella</h3><div id="est-top-producto">-</div><div id="est-top-producto-cantidad"></div></div>
        </div>

        <div id="view-backup" class="view">
            <div class="card">
                <h3>Copia de Seguridad</h3>
                <button class="btn" onclick="hacerBackupGeneral()">GENERAR RESPALDO</button>
                <hr style="margin: 20px 0;">
                <textarea id="texto-backup-import" placeholder="Pegá el código de backup aquí..."></textarea>
                <button class="btn btn-danger" onclick="cargarBackupGeneral()">CARGAR RESPALDO</button>
            </div>
        </div>
    </main>
<script>
        // --- CONFIGURACIÓN ---
        const SUPABASE_URL = "https://gudhifoitegxqqxihqoe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZSVDO8PMA26pQ7d-rpE0Hg_MX8PJT_E";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productos = [];
        let historial = [];
        let carrito = [];

        // --- SEGURIDAD Y NOTIFICACIONES ---
        function verificarPin() {
            if (document.getElementById('pin-input').value === "1502") {
                document.getElementById('pin-overlay').style.display = 'none';
                init();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'toast-error' : 'toast-success'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            if (type !== 'error') setTimeout(() => toast.remove(), 1500);
            else toast.onclick = () => toast.remove();
        }

        // --- INICIALIZACIÓN ---
        async function init() {
            try {
                const { data: p } = await supabaseClient.from('productos').select('*');
                const { data: h } = await supabaseClient.from('historial').select('*');
                productos = p || [];
                historial = h || [];
                actualizarPantallas();
                renderizarEstadisticas();
            } catch (e) { showToast("Error al conectar: " + e.message, 'error'); }
        }

        // --- LÓGICA DE VENTAS ---
        function agregarAlPedido() {
            const id = document.getElementById('select-producto').value;
            const cant = parseInt(document.getElementById('cantidad-producto').value);
            const p = productos.find(x => x.id == id);
            if(!p) return showToast("Seleccioná un producto", 'error');
            if(p.stock < cant) return showToast("Stock insuficiente", 'error');
            
            carrito.push({...p, cantidad: cant});
            document.getElementById('resumen-actual').style.display = 'block';
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById('lista-pedido');
            lista.innerHTML = carrito.map((item, index) => `
                <div class="list-item"><span>${item.cantidad}x ${item.nombre}</span><span>$${item.precio * item.cantidad}</span></div>
            `).join('');
            let total = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
            document.getElementById('total-pedido').innerText = '$' + total;
        }

        async function finalizarVenta(enviarWhatsApp) {
            const venta = {
                cliente: document.getElementById('cliente-nombre').value || "Cliente",
                items: carrito,
                total: carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0),
                fecha: new Date().toISOString(),
                notas: document.getElementById('notas-pedido').value
            };

            try {
                const { error } = await supabaseClient.from('historial').insert([venta]);
                if(error) throw error;

                for(let item of carrito) {
                    let p = productos.find(x => x.id == item.id);
                    await supabaseClient.from('productos').update({ stock: p.stock - item.cantidad }).eq('id', p.id);
                }

                if(enviarWhatsApp) {
                    let msg = `Pedido para ${venta.cliente}: ` + carrito.map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
                    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                }

                showToast("Venta finalizada exitosamente", 'success');
                carrito = [];
                document.getElementById('resumen-actual').style.display = 'none';
                init();
            } catch(e) { showToast("Error: " + e.message, 'error'); }
        }

        // --- GESTIÓN PRODUCTOS ---
        async function guardarProducto() {
            const nombre = document.getElementById('p-nombre').value;
            const precio = parseInt(document.getElementById('p-precio').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            const { error } = await supabaseClient.from('productos').insert([{ nombre, precio, stock }]);
            if(error) showToast("Error: " + error.message, 'error');
            else { showToast("Producto guardado", 'success'); init(); }
        }

        async function eliminarProducto(id) {
            if(!confirm("¿Borrar producto?")) return;
            await supabaseClient.from('productos').delete().eq('id', id);
            init();
        }

        function actualizarPantallas() {
            const sel = document.getElementById('select-producto');
            sel.innerHTML = '<option value="">Elegí un producto...</option>' + 
                            productos.map(p => `<option value="${p.id}">${p.nombre} ($${p.precio})</option>`).join('');
            
            document.getElementById('lista-inventario').innerHTML = productos.map(p => `
                <div class="card">
                    <strong>${p.nombre}</strong><br>Precio: $${p.precio} | Stock: ${p.stock}
                    <button class="btn" style="background:#b3261e; margin-top:5px;" onclick="eliminarProducto('${p.id}')">Eliminar</button>
                </div>`).join('');
        }

        function renderizarEstadisticas() {
            let total = historial.reduce((acc, h) => acc + h.total, 0);
            document.getElementById('est-total-ingresos').innerText = `$${total}`;
        }
        
        function switchTab(tab, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
            el.classList.add('active');
        }
    </script>
</body>
</html>
