<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aromas - OSHI HOME</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --oshi-gold: #D4AF37; --oshi-black: #1a1a1a; --md-sys-color-primary: #6750a4; --md-sys-color-on-primary: #ffffff; --md-sys-color-primary-container: #eaddff; --md-sys-color-surface: #fef7ff; --md-sys-color-on-surface: #1d1b20; --md-sys-color-surface-variant: #e7e0ec; --md-sys-color-outline: #79747e; --md-sys-color-error: #b3261e; --oshi-input-border: #d1d1d1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
        header { padding: 24px 20px; background: var(--md-sys-color-surface); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--md-sys-color-surface-variant); display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .tabs { display: flex; padding: 0 10px; border-bottom: 1px solid var(--md-sys-color-surface-variant); background: var(--md-sys-color-surface); flex-wrap: wrap; }
        .tab { flex: 1; min-width: 20%; padding: 16px 5px; text-align: center; font-size: 13px; font-weight: 600; color: var(--md-sys-color-outline); cursor: pointer; transition: all 0.3s ease; position: relative; }
        .tab.active { color: var(--md-sys-color-primary); }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 10%; right: 10%; height: 4px; background: var(--md-sys-color-primary); border-radius: 4px 4px 0 0; }
        main { flex: 1; padding: 24px; padding-bottom: 100px; }
        .view { display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; border-radius: 28px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--md-sys-color-surface-variant); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--oshi-input-border); font-size: 15px; background: transparent; color: var(--oshi-black); margin-bottom:12px; }
        .btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
        .btn-primary { background: var(--md-sys-color-primary); color: white; }
        .btn-danger { background: var(--md-sys-color-error); color: white; padding: 16px; font-size: 15px; border-radius: 20px; border: none; font-weight: 700; margin-top: 10px;}
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px dashed var(--md-sys-color-surface-variant); }
        .badge-stock-low { background: #ffebee; color: #b71c1c; padding: 6px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; }
        .badge-stock { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); padding: 6px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; }
        .menu-btn { flex: 1; padding: 20px 10px; border-radius: 24px; border: 1px solid var(--md-sys-color-surface-variant); display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; background: white; }
    </style>
</head>

                <h3 style="font-size:17px; margin-bottom:12px;">Detalle del Pedido</h3>
                <div class="card" id="lista-pedido"></div>
                <textarea id="notas-pedido" placeholder="Notas de entrega o dedicatoria (Opcional)" style="min-height: 60px; margin-bottom: 15px; font-family: 'Plus Jakarta Sans', sans-serif;"></textarea>
                <div class="card" style="background: var(--md-sys-color-primary-container);"><div style="display:flex; justify-content:space-between; font-weight:700; font-size:20px;"><span>TOTAL:</span><span id="total-pedido">$0</span></div></div>
                <button type="button" class="btn btn-primary" onclick="finalizarVenta(true)">Finalizar y WhatsApp</button>
                <button type="button" class="btn btn-primary" style="margin-top:10px; background:transparent; border:1px solid var(--md-sys-color-primary); color:var(--md-sys-color-primary);" onclick="finalizarVenta(false)">Solo Registrar</button>
            </div>
        </div>

        <div id="view-productos" class="view">
            <div id="pantalla-error-brutal"></div>
            <div id="prod-menu-main">
                <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                    <div class="menu-btn" onclick="mostrarSubVista('nuevo')"><span>➕</span><span>CARGAR NUEVO</span></div>
                    <div class="menu-btn" onclick="mostrarSubVista('sincronizar')"><span>🔄</span><span>IMPORTAR</span></div>
                </div>
                <h3 style="margin-bottom:15px; font-size:17px;">Inventario Actual</h3>
                <input type="text" id="buscar-producto" placeholder="🔍 Filtrar rápido..." oninput="actualizarPantallas()">
                <div id="lista-inventario"></div>
            </div>
            <div id="prod-sub-nuevo" style="display: none;">
                <button class="btn" style="width: auto; padding: 10px;" onclick="volverMenuProductos()">⬅ Volver</button>
                <div class="card">
                    <h3 id="form-producto-title">Añadir Producto</h3>
                    <input type="text" id="p-nombre" placeholder="Producto">
                    <input type="number" id="p-precio" placeholder="Precio ($)">
                    <input type="number" id="p-stock" placeholder="Stock">
                    <button class="btn btn-primary" onclick="guardarProducto()">Guardar</button>
                </div>
            </div>
            <div id="prod-sub-sincronizar" style="display: none;">
                <button class="btn" style="width: auto; padding: 10px;" onclick="volverMenuProductos()">⬅ Volver</button>
                <div class="card">
                    <h3>Sincronización</h3>
                    <textarea id="texto-importacion" placeholder="Pegar datos de Excel aquí..."></textarea>
                    <button class="btn btn-primary" onclick="importarFuerzaBruta()">✅ FORZAR IMPORTACIÓN</button>
                </div>
            </div>
        </div>

        <div id="view-historial" class="view">
            <h3 style="margin-bottom:15px;">Ventas Realizadas</h3>
            <div class="card">
                <input type="text" id="buscar-historial" placeholder="🔍 Buscar cliente..." oninput="renderizarHistorial()">
                <select id="filtro-mes-historial" onchange="renderizarHistorial()"></select>
            </div>
            <div id="lista-historial"></div>
        </div>

        <div id="view-estadisticas" class="view">
            <div class="card"><h3>Ingresos Totales</h3><h1 id="est-total-ingresos">$0</h1></div>
            <div class="card"><h3>Producto Estrella</h3><div id="est-top-producto">-</div></div>
        </div>

        <div id="view-backup" class="view">
            <div class="card">
                <h3>Copia de Seguridad</h3>
                <button class="btn btn-primary" onclick="hacerBackupGeneral()">GENERAR RESPALDO</button>
                <hr style="margin: 20px 0;">
                <textarea id="texto-backup-import" placeholder="Pegá el código de backup aquí..."></textarea>
                <button class="btn btn-danger" onclick="cargarBackupGeneral()">CARGAR RESPALDO</button>
            </div>
        </div>
    </main>
<script>
        // --- VARIABLES GLOBALES ---
        let productos = [];
        let historial = [];
        let carrito = [];

        // --- INICIALIZACIÓN ---
        async function init() {
            try {
                // Obtener datos de Supabase
                const { data: p } = await supabase.from('productos').select('*');
                const { data: h } = await supabase.from('historial').select('*');
                
                productos = p || [];
                historial = h || [];
                
                actualizarPantallas();
            } catch (e) {
                console.error("Error al cargar:", e);
            }
        }

        // --- LÓGICA DE NAVEGACIÓN ---
        function switchTab(tab, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
            el.classList.add('active');
        }

        function mostrarSubVista(vista) {
            document.getElementById('prod-menu-main').style.display = 'none';
            document.getElementById('prod-sub-' + vista).style.display = 'block';
        }

        function volverMenuProductos() {
            document.getElementById('prod-menu-main').style.display = 'block';
            document.getElementById('prod-sub-nuevo').style.display = 'none';
            document.getElementById('prod-sub-sincronizar').style.display = 'none';
        }

        // --- LÓGICA DE VENTAS ---
        function actualizarPantallas() {
            // Select de Productos
            const sel = document.getElementById('select-producto');
            sel.innerHTML = '<option value="">Elegí un producto...</option>' + 
                            productos.map(p => `<option value="${p.id}">${p.nombre} ($${p.precio})</option>`).join('');
            
            // Lista Inventario
            const inv = document.getElementById('lista-inventario');
            inv.innerHTML = productos.map(p => `
                <div class="card">
                    <strong>${p.nombre}</strong><br>
                    Precio: $${p.precio} | Stock: ${p.stock}
                </div>`).join('');
        }

        async function agregarAlPedido() {
            const id = document.getElementById('select-producto').value;
            const p = productos.find(x => x.id == id);
            if(!p) return alert("Seleccioná un producto");
            
            carrito.push({...p, cantidad: 1});
            document.getElementById('resumen-actual').style.display = 'block';
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById('lista-pedido');
            lista.innerHTML = carrito.map((item, index) => `
                <div class="list-item">
                    <span>${item.nombre}</span>
                    <span>$${item.precio}</span>
                </div>`).join('');
            let total = carrito.reduce((sum, item) => sum + item.precio, 0);
            document.getElementById('total-pedido').innerText = '$' + total;
        }

        async function finalizarVenta(enviarWhatsApp) {
            const venta = {
                cliente: document.getElementById('cliente-nombre').value || "Cliente",
                items: carrito,
                total: carrito.reduce((s, i) => s + i.precio, 0),
                fecha: new Date().toISOString(),
                notas: document.getElementById('notas-pedido').value
            };

            // Guardar en Supabase
            const { error } = await supabase.from('historial').insert([venta]);
            if(error) return alert("Error al guardar: " + error.message);

            // Actualizar stock local y en Supabase
            for(let item of carrito) {
                let p = productos.find(x => x.id == item.id);
                p.stock -= 1;
                await supabase.from('productos').update({ stock: p.stock }).eq('id', p.id);
            }

            alert("Venta registrada!");
            carrito = [];
            document.getElementById('resumen-actual').style.display = 'none';
            init();
        }

        async function guardarProducto() {
            const p = {
                nombre: document.getElementById('p-nombre').value,
                precio: parseInt(document.getElementById('p-precio').value),
                stock: parseInt(document.getElementById('p-stock').value)
            };
            await supabase.from('productos').insert([p]);
            alert("Producto guardado");
            init();
            volverMenuProductos();
        }

        // Ejecutar al cargar
        init();
    </script>
</body>
</html>
