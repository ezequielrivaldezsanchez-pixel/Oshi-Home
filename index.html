<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSHI HOME - V7</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --md-sys-color-primary: #6750a4; --md-sys-color-surface: #fef7ff; --md-sys-color-on-surface: #1d1b20; --md-sys-color-surface-variant: #e7e0ec; --md-sys-color-error: #b3261e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); max-width: 480px; margin: 0 auto; min-height: 100vh; }
        
        /* PIN SEGURIDAD */
        #pin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        /* TOASTS */
        #toast-container { position: fixed; top: 20px; width: 100%; z-index: 9999; pointer-events: none; text-align: center; }
        .toast { padding: 15px 25px; margin: 10px; border-radius: 12px; color: white; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; pointer-events: all; }
        .toast-success { background: #4caf50; }
        .toast-error { background: var(--md-sys-color-error); }
        
        header { padding: 24px; text-align: center; border-bottom: 1px solid var(--md-sys-color-surface-variant); }
        .tabs { display: flex; border-bottom: 1px solid var(--md-sys-color-surface-variant); position: sticky; top: 0; z-index: 90; background: white; }
        .tab { flex: 1; padding: 15px; text-align: center; font-size: 13px; font-weight: 600; color: #79747e; cursor: pointer; }
        .tab.active { color: var(--md-sys-color-primary); border-bottom: 2px solid var(--md-sys-color-primary); }
        
        main { padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #e7e0ec; }
        input, select, textarea { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #d1d1d1; margin-bottom: 10px; }
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: bold; background: var(--md-sys-color-primary); color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="pin-overlay">
        <img src="logo.png" alt="OSHI HOME" style="max-width: 180px; margin-bottom: 20px;">
        <input type="password" id="pin-input" placeholder="PIN" style="width: 200px; text-align: center;">
        <p style="margin-bottom: 20px; color: #79747e; font-size: 14px;">Ingresá el pin de seguridad para acceder a la app</p>
        <button class="btn" style="width: 200px;" onclick="verificarPin()">Acceder</button>
    </div>

    <div id="toast-container"></div>

    <header>
        <img src="logo.png" alt="OSHI HOME Logo" style="max-width: 150px;">
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('ventas', this)">Vender</div>
        <div class="tab" onclick="switchTab('productos', this)">Productos</div>
        <div class="tab" onclick="switchTab('historial', this)">Historial</div>
        <div class="tab" onclick="switchTab('estadisticas', this)">Stats</div>
        <div class="tab" onclick="switchTab('backup', this)">Backup</div>
    </div>


<main>
        <div id="view-ventas" class="view active">
            <div class="card">
                <label>Nombre del Cliente</label>
                <input type="text" id="cliente-nombre" placeholder="Nombre...">
                <label>Seleccionar Producto</label>
                <select id="select-producto"><option value="">Cargando...</option></select>
                <label>Cantidad</label>
                <input type="number" id="cantidad-producto" value="1" min="1">
                <button type="button" class="btn" onclick="agregarAlPedido()">+ Agregar al pedido</button>
            </div>
            <div id="resumen-actual" style="display:none;">
                <h3 style="font-size:17px; margin-bottom:12px;">Detalle del Pedido</h3>
                <div class="card" id="lista-pedido"></div>
                <textarea id="notas-pedido" placeholder="Notas / Dedicatoria"></textarea>
                <div class="card" style="background: var(--md-sys-color-primary-container);">
                    <div style="display:flex; justify-content:space-between; font-weight:700; font-size:20px;">
                        <span>TOTAL:</span><span id="total-pedido">$0</span>
                    </div>
                </div>
                <button type="button" class="btn" onclick="finalizarVenta(true)">Finalizar y WhatsApp</button>
                <button type="button" class="btn" style="margin-top:10px; background:transparent; border:1px solid var(--md-sys-color-primary); color:var(--md-sys-color-primary);" onclick="finalizarVenta(false)">Solo Registrar</button>
            </div>
        </div>

        <div id="view-productos" class="view">
            <div class="card">
                <h3 id="form-producto-title">Añadir Producto</h3>
                <input type="hidden" id="p-id">
                <input type="text" id="p-nombre" placeholder="Nombre Producto">
                <input type="number" id="p-precio" placeholder="Precio ($)">
                <input type="number" id="p-stock" placeholder="Stock">
                <div id="form-buttons-añadir">
                    <button class="btn" onclick="guardarProducto()">Guardar Producto</button>
                </div>
                <div id="form-buttons-editar" style="display:none;">
                    <button class="btn" onclick="actualizarProducto()">Confirmar Edición</button>
                    <button class="btn" style="background:#79747e; margin-top:10px;" onclick="limpiarFormularioProducto()">Cancelar</button>
                </div>
            </div>
            <div id="lista-inventario"></div>
        </div>

        <div id="view-historial" class="view">
            <h3 style="margin-bottom:15px;">Ventas Realizadas</h3>
            <div id="lista-historial"></div>
        </div>

        <div id="view-estadisticas" class="view">
            <div class="card"><h3>Ingresos Totales</h3><h1 id="est-total-ingresos">$0</h1></div>
            <div class="card"><h3>Producto Estrella</h3><div id="est-top-producto">-</div></div>
        </div>

        <div id="view-backup" class="view">
            <div class="card">
                <h3>Copia de Seguridad</h3>
                <button class="btn" onclick="hacerBackupGeneral()">GENERAR RESPALDO</button>
                <hr style="margin: 20px 0;">
                <textarea id="texto-backup-import" placeholder="Pegá el código de backup aquí..."></textarea>
                <button class="btn" style="background:var(--md-sys-color-error);" onclick="cargarBackupGeneral()">CARGAR RESPALDO</button>
            </div>
        </div>
    </main>

<script>
        // --- CONFIGURACIÓN ---
        const SUPABASE_URL = "https://gudhifoitegxqqxihqoe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZSVDO8PMA26pQ7d-rpE0Hg_MX8PJT_E";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productos = [];
        let historial = [];
        let carrito = [];
        let editingId = null;

        // --- SEGURIDAD ---
        function verificarPin() {
            if (document.getElementById('pin-input').value === "1502") {
                document.getElementById('pin-overlay').style.display = 'none';
                init();
            } else {
                alert("PIN incorrecto");
            }
        }

        // --- NOTIFICACIONES ---
        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            if (!isError) setTimeout(() => toast.remove(), 1500);
            else toast.onclick = () => toast.remove();
        }

        // --- INICIALIZACIÓN ---
        async function init() {
            try {
                const { data: p } = await supabaseClient.from('productos').select('*');
                const { data: h } = await supabaseClient.from('historial').select('*').order('fecha', { ascending: false });
                productos = p || [];
                historial = h || [];
                actualizarPantallas();
                renderizarHistorial();
                renderizarEstadisticas();
            } catch (e) { showToast("Error al conectar: " + e.message, true); }
        }

        // --- LÓGICA DE VENTAS ---
        function agregarAlPedido() {
            const id = document.getElementById('select-producto').value;
            const cant = parseInt(document.getElementById('cantidad-producto').value);
            const p = productos.find(x => x.id == id);
            if(!p) return showToast("Seleccioná un producto", true);
            if(p.stock < cant) return showToast("Stock insuficiente", true);
            
            carrito.push({...p, cantidad: cant});
            document.getElementById('resumen-actual').style.display = 'block';
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById('lista-pedido');
            lista.innerHTML = carrito.map((item, index) => `
                <div class="list-item"><span>${item.cantidad}x ${item.nombre}</span><span>$${item.precio * item.cantidad}</span></div>
            `).join('');
            let total = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
            document.getElementById('total-pedido').innerText = '$' + total;
        }

        async function finalizarVenta(enviarWhatsApp) {
            const cliente = document.getElementById('cliente-nombre').value || "Cliente";
            const total = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
            const venta = { cliente, items: carrito, total, fecha: new Date().toISOString(), notas: document.getElementById('notas-pedido').value };

            try {
                const { error } = await supabaseClient.from('historial').insert([venta]);
                if(error) throw error;
                for(let item of carrito) {
                    await supabaseClient.from('productos').update({ stock: item.stock - item.cantidad }).eq('id', item.id);
                }
                if(enviarWhatsApp) {
                    let msg = `Hola ${cliente}! Gracias por tu compra en OSHI HOME. Detalle:\n` + carrito.map(i => `- ${i.cantidad}x ${i.nombre}`).join('\n') + `\nTotal: $${total}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                }
                showToast("Venta registrada correctamente");
                carrito = [];
                document.getElementById('resumen-actual').style.display = 'none';
                init();
            } catch(e) { showToast("Error al registrar: " + e.message, true); }
        }

        // --- PRODUCTOS ---
        async function guardarProducto() {
            const nombre = document.getElementById('p-nombre').value;
            const precio = parseInt(document.getElementById('p-precio').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            const { error } = await supabaseClient.from('productos').insert([{ nombre, precio, stock }]);
            if(error) showToast("Error: " + error.message, true); else showToast("Guardado!");
            limpiarFormularioProducto();
            init();
        }

        async function actualizarProducto() {
            const nombre = document.getElementById('p-nombre').value;
            const precio = parseInt(document.getElementById('p-precio').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            await supabaseClient.from('productos').update({ nombre, precio, stock }).eq('id', editingId);
            showToast("Producto actualizado");
            limpiarFormularioProducto();
            init();
        }

        function editarProducto(id) {
            const p = productos.find(x => x.id == id);
            document.getElementById('p-nombre').value = p.nombre;
            document.getElementById('p-precio').value = p.precio;
            document.getElementById('p-stock').value = p.stock;
            editingId = p.id;
            document.getElementById('form-producto-title').innerText = "Editando...";
            document.getElementById('form-buttons-añadir').style.display = 'none';
            document.getElementById('form-buttons-editar').style.display = 'block';
        }

        function limpiarFormularioProducto() {
            document.getElementById('p-nombre').value = '';
            document.getElementById('p-precio').value = '';
            document.getElementById('p-stock').value = '';
            editingId = null;
            document.getElementById('form-producto-title').innerText = "Añadir Producto";
            document.getElementById('form-buttons-añadir').style.display = 'block';
            document.getElementById('form-buttons-editar').style.display = 'none';
        }

        async function eliminarProducto(id) {
            if(!confirm("¿Borrar producto?")) return;
            await supabaseClient.from('productos').delete().eq('id', id);
            init();
        }

        function actualizarPantallas() {
            const sel = document.getElementById('select-producto');
            sel.innerHTML = '<option value="">Elegí un producto...</option>' + 
                            productos.map(p => `<option value="${p.id}">${p.nombre} ($${p.precio})</option>`).join('');
            document.getElementById('lista-inventario').innerHTML = productos.map(p => `
                <div class="card">
                    <strong>${p.nombre}</strong><br>Precio: $${p.precio} | Stock: ${p.stock}
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn" style="background:var(--md-sys-color-primary);" onclick="editarProducto('${p.id}')">Editar</button>
                        <button class="btn" style="background:#b3261e;" onclick="eliminarProducto('${p.id}')">Borrar</button>
                    </div>
                </div>`).join('');
        }

        // --- AUXILIARES ---
        function renderizarHistorial() {
            document.getElementById('lista-historial').innerHTML = historial.map(h => `
                <div class="card"><strong>${h.cliente}</strong><br>Total: $${h.total}<br><small>${new Date(h.fecha).toLocaleDateString()}</small></div>
            `).join('');
        }

        function renderizarEstadisticas() {
            let total = historial.reduce((acc, h) => acc + h.total, 0);
            document.getElementById('est-total-ingresos').innerText = `$${total}`;
        }
        
        function switchTab(tab, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
            el.classList.add('active');
        }

        // --- BACKUP ---
        function hacerBackupGeneral() {
            const data = { productos, historial };
            document.getElementById('texto-backup-import').value = JSON.stringify(data);
            showToast("Backup generado en el campo de texto");
        }

        async function cargarBackupGeneral() {
            try {
                const data = JSON.parse(document.getElementById('texto-backup-import').value);
                // Aquí iría lógica compleja de migración si fuera necesario, por ahora alerta:
                alert("Esta función requiere sobrescritura de base de datos. Asegúrate de tener respaldo.");
            } catch(e) { showToast("Error en formato de backup", true); }
        }
    </script>
</body>
</html>
