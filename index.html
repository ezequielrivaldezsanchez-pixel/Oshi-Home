<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aromas - OSHI HOME</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --oshi-gold: #D4AF37; --oshi-black: #1a1a1a; --md-sys-color-primary: #6750a4; --md-sys-color-surface: #fef7ff; --md-sys-color-surface-variant: #e7e0ec; --md-sys-color-outline: #79747e; --md-sys-color-error: #b3261e; }
        body { margin: 0; padding: 0; background-color: var(--md-sys-color-surface); color: #1d1b20; font-family: 'Plus Jakarta Sans', sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        header { padding: 24px; text-align: center; border-bottom: 1px solid var(--md-sys-color-surface-variant); }
        .tab { padding: 15px; text-align: center; font-weight: bold; cursor: pointer; color: var(--md-sys-color-outline); }
        .view { display: none; padding: 20px; }
        .view.active { display: block; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #e7e0ec; }
        input, select, textarea { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #d1d1d1; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; background: var(--md-sys-color-primary); color: white; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <img id="logo-img" style="max-width: 150px; height: auto;">
    </header>

    <div style="display: flex; border-bottom: 1px solid #eee;">
        <div class="tab active" onclick="switchTab('ventas', this)">Vender</div>
        <div class="tab" onclick="switchTab('productos', this)">Productos</div>
        <div class="tab" onclick="switchTab('historial', this)">Historial</div>
    </div>

    <main>
        <div id="view-ventas" class="view active">
            <div class="card">
                <input type="text" id="cliente-nombre" placeholder="Nombre del Cliente">
                <select id="select-producto"><option value="">Cargando productos...</option></select>
                <button class="btn" onclick="agregarAlPedido()">+ Agregar</button>
            </div>
            <div id="resumen-actual"></div>
        </div>
        <div id="view-productos" class="view">
            <div id="lista-inventario"></div>
        </div>
        <div id="view-historial" class="view">
            <div id="lista-historial"></div>
        </div>
    </main>

    <script>
        // --- CONFIGURACIÓN NUBE ---
        const SUPABASE_URL = "https://gudhifoitegxqqxihqoe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZSVDO8PMA26pQ7d-rpE0Hg_MX8PJT_E";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productos = [];
        let historial = [];

        // --- INICIALIZACIÓN ---
        async function init() {
            // Cargar Logo (Si tenías un base64, aquí se inyecta)
            // Nota: He puesto una carga simple para que el código funcione ya.
            
            // Cargar Datos de Nube
            const { data: p } = await supabase.from('productos').select('*');
            const { data: h } = await supabase.from('historial').select('*');
            productos = p || [];
            historial = h || [];
            actualizarPantallas();
        }

        async function guardarDatos() {
            // Guardado automático en Nube
            await supabase.from('productos').upsert(productos);
            await supabase.from('historial').upsert(historial);
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.style.color = '#79747e');
            document.getElementById('view-' + tab).classList.add('active');
            el.style.color = '#6750a4';
        }

        function actualizarPantallas() {
            const sel = document.getElementById('select-producto');
            sel.innerHTML = productos.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
            
            const inv = document.getElementById('lista-inventario');
            inv.innerHTML = productos.map(p => `<div class="card">${p.nombre} - Stock: ${p.stock}</div>`).join('');
        }

        init();
    </script>
</body>
</html>
